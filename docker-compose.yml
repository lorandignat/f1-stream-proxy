services:
  f1-stream-proxy:
    image: ghcr.io/lorandignat/f1-stream-proxy:latest
    container_name: f1-stream-proxy
    ports:
      - "9080:9080"
    environment:
      - SCRAPE_INTERVAL_MIN=15
      - SOURCES=vipbox:https://vipbox1.com/moto_gp,gkstreams:https://gkstreams3.click/?id=las-vegas-grand-prix-race
      - CACHE_TTL_SEC=300
      - SEGMENT_CACHE_MAX=64
      - LOG_LEVEL=info
      - PUBLIC_URL=
    restart: unless-stopped
