services:
  f1-stream-proxy:
    image: ghcr.io/lorandignat/f1-stream-proxy:latest
    container_name: f1-stream-proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SCRAPE_INTERVAL_MIN=15
      - VIPBOX_URL=https://vipbox1.com/moto_gp
      - CACHE_TTL_SEC=300
      - SEGMENT_CACHE_MAX=64
      - LOG_LEVEL=info
      - PUBLIC_URL=
    restart: unless-stopped
    # To build locally instead of pulling the image, replace the lines above with:
    # build: .
    # and run: docker compose up -d --build
EOF